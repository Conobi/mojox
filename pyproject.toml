[project]
name = "mojox-workspace"
version = "0"
description = "Workspace root for the mojox ecosystem (mojox-core + mojox + mojox-build)."
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mojox       = { workspace = true }
mojox-core  = { workspace = true }
mojox-build = { workspace = true }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
  "BLE001",   # blind except Exception — intentional in error-handling layers
  "S102",     # exec usage — used in test fixtures
  "PLW1510",  # subprocess.run without check — returncode checked manually
]

[project]
name = "mojox"
version = "0.6.2"
description = "CLI and execution layer for Mojo build tooling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mojox-core>=0.6,<0.7", "mojo-compiler>=1.0"]
authors = [{name = "Conobi"}]

[project.urls]
Repository = "https://github.com/Conobi/mojox"

[project.scripts]
mojox = "mojox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mojox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: requires real mojo compiler and/or LLVM tools",
]

[tool.mypy]
strict = true

[tool.semantic_release]
commit_parser = "conventional-monorepo"
tag_format = "mojox-v{version}"
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore: release mojox {version}"
allow_zero_version = true
# uv.lock records every workspace member's version, so re-lock after the bump
# and stage it: PSR commits the whole index, so the lock lands in the release
# commit. The command runs from this package dir, hence `../../uv.lock`. Do not
# list uv.lock in `assets`: PSR also uploads assets to the GitHub Release,
# resolving them from this dir, where no uv.lock exists.
# Distributions are built by the publish-pypi job, not here.
build_command = "uv lock && git add ../../uv.lock"

[tool.semantic_release.commit_parser_options]
path_filters = ["."]

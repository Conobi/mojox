[project]
name = "mojox"
version = "0.4.0"
description = "CLI and execution layer for Mojo build tooling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mojox-core", "mojo-compiler"]
authors = [{name = "Conobi"}]

[project.urls]
Repository = "https://github.com/Conobi/mojox"

[project.scripts]
mojox = "mojox._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mojox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: requires real mojo compiler and/or LLVM tools",
]

[tool.mypy]
strict = true

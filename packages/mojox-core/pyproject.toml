[project]
name = "mojox-core"
version = "0.5.0"
description = "Pure model layer for mojox: manifest parsing, target discovery, policy resolution, and build planning."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Conobi" }]
dependencies = [
  "packaging>=23.0",
  'tomli >= 1.1.0; python_version < "3.11"',
]

[project.urls]
Repository = "https://github.com/Conobi/mojox"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mojox_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

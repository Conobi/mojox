[project]
name = "mojox-build"
version = "0.4.0"
description = "PEP 517 / PEP 660 build backend for Mojo libraries (compiles .mojo packages into wheels)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Conobi" }]
dependencies = [
  "mojox-core",
  "packaging>=23.0",
  'tomli >= 1.1.0; python_version < "3.11"',
]

[project.urls]
Repository = "https://github.com/Conobi/mojox"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mojox_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.semantic_release]
commit_parser = "conventional-monorepo"
tag_format = "mojox-build-v{version}"
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore: release mojox-build {version}"
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
path_filters = ["."]

[project]
name = "mojox-build"
version = "0.6.0"
description = "PEP 517 / PEP 660 build backend for Mojo libraries (compiles .mojo packages into wheels)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Conobi" }]
dependencies = [
  "mojox-core>=0.6,<0.7",
  "packaging>=23.0",
  'tomli >= 1.1.0; python_version < "3.11"',
]

[project.urls]
Repository = "https://github.com/Conobi/mojox"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mojox_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.semantic_release]
commit_parser = "conventional-monorepo"
tag_format = "mojox-build-v{version}"
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore: release mojox-build {version}"
allow_zero_version = true
# uv.lock records every workspace member's version, so re-lock after the bump
# and stage it: PSR commits the whole index, so the lock lands in the release
# commit. The command runs from this package dir, hence `../../uv.lock`. Do not
# list uv.lock in `assets`: PSR also uploads assets to the GitHub Release,
# resolving them from this dir, where no uv.lock exists.
# Distributions are built by the publish-pypi job, not here.
build_command = "uv lock && git add ../../uv.lock"

[tool.semantic_release.commit_parser_options]
path_filters = ["."]

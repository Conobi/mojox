name: Release

# Mode A: workflow_dispatch — PSR-powered release for mojox / mojox-build
# Mode B: tag push — manual release for mojox-core
on:
  push:
    tags:
      - 'mojox-core-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        type: choice
        options:
          - mojox
          - mojox-build
      destination:
        description: 'Index to publish to'
        required: true
        default: pypi
        type: choice
        options:
          - pypi
          - testpypi

# ── Mode A: PSR release ─────────────────────────────────────────────

jobs:
  release:
    name: Semantic Release (${{ github.event.inputs.package }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.inputs.package }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.version.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Force branch to workflow SHA
        run: git reset --hard ${{ github.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install semantic-release
        run: uv tool install python-semantic-release

      - name: Determine version
        id: version
        working-directory: packages/${{ github.event.inputs.package }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          semantic-release version
          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$AFTER" >> "$GITHUB_OUTPUT"
            echo "Released: $AFTER"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release needed"
          fi

      - name: Publish to GitHub
        if: steps.version.outputs.released == 'true'
        working-directory: packages/${{ github.event.inputs.package }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release publish

  deploy:
    name: Publish to ${{ github.event.inputs.destination }}
    if: github.event_name == 'workflow_dispatch' && needs.release.outputs.released == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ github.event.inputs.destination }}
      url: https://${{ github.event.inputs.destination == 'testpypi' && 'test.' || '' }}pypi.org/project/${{ github.event.inputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build
        run: |
          rm -rf dist/
          uv build --package "${{ github.event.inputs.package }}"
          ls -la dist/

      - name: Publish to PyPI
        if: github.event.inputs.destination != 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

      - name: Publish to TestPyPI
        if: github.event.inputs.destination == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  # ── Mode B: mojox-core manual release ──────────────────────────────

  publish-core:
    name: Publish mojox-core
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/mojox-core
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Verify tag matches pyproject.toml version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#mojox-core-v}"
          declared=$(grep -E '^version[[:space:]]*=' \
                       packages/mojox-core/pyproject.toml \
                       | head -1 | cut -d'"' -f2)
          if [ "$declared" != "$version" ]; then
            echo "Tag version ($version) does not match" \
                 "packages/mojox-core/pyproject.toml ($declared)" >&2
            exit 1
          fi
          echo "Releasing mojox-core $version"

      - name: Build
        run: |
          rm -rf dist/
          uv build --package mojox-core
          ls -la dist/

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
